[package]
name = "orangexp-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Deterministic, platform-independent computational engine for OrangeXP."
repository = "https://github.com/AmmaarBakshi/OrangeXP"
publish = false

[lib]
name = "orangexp_core"
# `lib` for tests/other Rust consumers, `cdylib` for the Android shared library.
crate-type = ["lib", "cdylib"]

[features]
default = []
# Enables the UniFFI bindings layer. The pure engine never depends on it.
ffi = ["dep:uniffi"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = { version = "0.29", optional = true }

[workspace]
members = [".", "uniffi-bindgen"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Keep the symbol table: UniFFI reads binding metadata from it. AGP strips
# unneeded symbols again when packaging the APK.
strip = "debuginfo"
