[package]
name = "uniffi-bindgen"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Local UniFFI binding generator pinned to the engine's UniFFI version."

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
