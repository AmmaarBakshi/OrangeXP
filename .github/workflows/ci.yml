name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Rust engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orangexp-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: orangexp-core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: orangexp-core
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: No duplicate string resource names across modules
        # Android merges all modules' resources into one namespace; a duplicate
        # name silently replaces another module's string.
        run: |
          dupes=$(grep -ho 'name="[a-z_0-9]*"' */*/src/main/res/values/strings.xml app/src/main/res/values/strings.xml | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "Duplicate string names: $dupes"; exit 1; fi
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: orangexp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
